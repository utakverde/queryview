<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Lantern · Sales CRM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/lantern.css"></head>
<body class="lantern-page ui-uniform"><header><div class="mark lantern-mark">L</div><div class="site-brand"><p class="eyebrow">Sales workspace</p><h1>Lantern CRM</h1></div><nav aria-label="Main reports"></nav><div class="live"><i></i> Local workspace</div></header>
<main><section class="lantern-top"><div><p class="eyebrow">Pipeline · <span id="today-label"></span></p><h2>Deals, moving<br><em>in the right light.</em></h2><p class="lantern-lead">A clear view of your relationships, next steps, and the work that is close to winning.</p></div><div class="lantern-top-actions"><label class="searchbox"><span>⌕</span><input id="global-search" type="search" placeholder="Search deals and customers"></label><button id="new-deal" class="lantern-primary">＋ New deal</button><button id="new-customer" class="lantern-quiet">＋ Customer</button></div></section>
<section class="lantern-stats" id="pipeline-stats"></section><section class="lantern-board" id="deal-board" aria-label="Sales pipeline"></section>
<section class="lantern-lower"><article class="glass-panel customer-panel"><div class="panel-heading"><div><p class="eyebrow">Relationships</p><h3>Customers</h3></div><span id="customer-count" class="soft-count"></span></div><div id="customer-list" class="customer-list"></div></article><article class="glass-panel invoice-panel"><div class="panel-heading"><div><p class="eyebrow">Follow through</p><h3>Invoices</h3></div><span id="invoice-count" class="soft-count"></span></div><div id="invoice-list" class="invoice-list"></div></article></section>
</main><dialog id="record-dialog" class="lantern-dialog"><form id="record-form" method="dialog"><div class="dialog-heading"><div><p class="eyebrow" id="dialog-eyebrow">Sales workspace</p><h3 id="dialog-title">New record</h3></div><button type="button" class="icon-button" id="dialog-close" aria-label="Close">×</button></div><div id="dialog-fields" class="dialog-fields"></div><div class="dialog-actions"><button type="button" class="lantern-quiet" id="dialog-cancel">Cancel</button><button type="submit" class="lantern-primary">Save</button></div></form></dialog><div id="toast" class="lantern-toast" role="status"></div>
<script type="module" src="/lantern.js?v=1"></script><script type="module" src="/theme.js?v=1"></script></body></html>
